name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # nötig, um Releases anzulegen

jobs:
  build:
    runs-on: ubuntu-latest   # Android SDK ist auf dem Runner vorinstalliert
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('0.0.{0}-dev', github.run_number) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      # --- Branches / PRs: Debug-APK als Build-Artefakt ---
      - name: Debug-APK bauen
        if: github.ref_type != 'tag'
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: zettelwirtschaft-debug
          path: app/build/outputs/apk/debug/*.apk

      # --- Tags v*: signierte Release-APK als GitHub Release ---
      - name: Keystore aus Secret wiederherstellen
        if: github.ref_type == 'tag'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 fehlt – Release kann nicht signiert werden."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Release-APK bauen
        if: github.ref_type == 'tag'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk zettelwirtschaft.apk

      - name: GitHub Release veröffentlichen
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" zettelwirtschaft.apk \
            --title "Zettelwirtschaft $GITHUB_REF_NAME" \
            --generate-notes
